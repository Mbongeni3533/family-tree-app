<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Dashboard Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
<div class="min-h-screen flex">
    <!-- Sidebar -->
    <div class="w-64 bg-blue-600 text-white h-screen">
        <div class="p-4">
            <h1 class="text-xl font-bold">Family Tree</h1>
        </div>
        <nav class="space-y-1 px-2">
            <div class="flex items-center gap-2 px-3 py-2 bg-blue-700 rounded">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 3v4l3 3 3-3V3h4v4l-3 3v6c0 3.31-2.69 6-6 6s-6-2.69-6-6V7l-3-3V3h4z"/></svg>
                Dashboard
            </div>
            <a href="#" class="flex items-center gap-2 px-3 py-2 hover:bg-blue-700 rounded">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M7 20h10a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v13a2 2 0 002 2z"/></svg>
                Visual Tree
            </a>
        </nav>
        <div class="p-4 border-t border-blue-700">
            <div class="text-xs text-blue-200 mb-1">Signed in as</div>
            <div class="font-medium">John Doe</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Family Tree Dashboard</h1>
                <p class="text-gray-600 mt-1">Manage your genealogy and family relationships</p>
            </div>
            <div class="flex gap-3">
                <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 9l2 2 2-2 4 4-4 4-2-2-4 4z"/></svg>
                    Visual Tree
                </a>
                <button class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
                    Add Family Member
                </button>
            </div>
        </div>

        <!-- Family Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Relationship</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Birth Date</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">John Doe</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Me</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Jan 15, 1980</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Alive</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="text-blue-600 hover:text-blue-900 mr-4">Edit</button>
                            <button class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Jane Doe</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Spouse</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Mar 22, 1982</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Alive</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="text-blue-600 hover:text-blue-900 mr-4">Edit</button>
                            <button class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Sam Doe</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Child</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Jun 10, 2005</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Alive</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="text-blue-600 hover:text-blue-900 mr-4">Edit</button>
                            <button class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
